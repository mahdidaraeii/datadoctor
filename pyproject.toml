[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadoctor"
dynamic = ["version"]
description = "A diagnostic workbench for tabular datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahdi Esmaeili Daraei", email = "mahdied2021@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "typer>=0.27.2",
]

[tool.hatch.version]
path = "src/datadoctor/__init__.py"
