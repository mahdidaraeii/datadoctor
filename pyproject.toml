[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datadoctor"
dynamic = ["version"]
description = "A diagnostic workbench for tabular datasets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mahdi Esmaeili Daraei", email = "mahdied2021@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "datadoctor[parquet,excel]",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
parquet = [
    "pyarrow>=25.0.1",
]
excel = [
    "openpyxl>=3.1.5",
]

[tool.hatch.version]
path = "src/datadoctor/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
